<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مدیریت | آقای موبایل</title><link rel="stylesheet" href="/admin.css"></head><body>
<div id="login" class="login"><div class="box"><b>MR MOBILE</b><h1>ورود مدیریت</h1><p>برای مدیریت محصولات رمز را وارد کن.</p><input id="pass" type="password" placeholder="رمز مدیریت"><button onclick="login()">ورود</button><div id="err"></div></div></div>
<div id="app" hidden><header><div><b>پنل آقای موبایل</b><small>مدیریت محصولات</small></div><button class="out" onclick="logout()">خروج</button></header><main><section class="form"><h2 id="formTitle">افزودن محصول</h2><input id="name" placeholder="نام محصول *"><input id="price" placeholder="قیمت * مثال: ۳۵,۰۰۰,۰۰۰ تومان"><select id="condition"><option>نو</option><option>کارکرده</option><option>استوک</option></select><textarea id="desc" placeholder="توضیحات"></textarea><label class="file">🖼️ انتخاب عکس <input id="file" type="file" accept="image/*" onchange="upload()"></label><div id="preview"></div><label class="check"><input id="available" type="checkbox" checked> محصول موجود است</label><div class="row"><button onclick="save()">ذخیره محصول</button><button class="muted" onclick="resetForm()">انصراف</button></div><p id="msg"></p></section><section><div class="listhead"><h2>محصولات</h2><button onclick="load()">بروزرسانی</button></div><div id="list" class="list"></div></section></main></div>
<script>
let editing=null,imageKey='';
const $=id=>document.getElementById(id);
async function api(url,opt={}){let r=await fetch(url,opt);let d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'خطا');return d}
async function check(){const d=await api('/api/me');if(d.admin){$('login').hidden=true;$('app').hidden=false;load()}else $('login').hidden=false}
async function login(){try{await api('/api/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({password:$('pass').value})});check()}catch(e){$('err').textContent=e.message}}
async function logout(){await api('/api/logout',{method:'POST'});location.reload()}
async function upload(){const f=$('file').files[0];if(!f)return;const fd=new FormData();fd.append('file',f);try{const d=await api('/api/upload',{method:'POST',body:fd});imageKey=d.key;$('preview').innerHTML=`<img src="/media/${encodeURIComponent(imageKey)}">`}catch(e){$('msg').textContent=e.message}}
async function load(){const p=await api('/api/products?admin=1');$('list').innerHTML=p.map(x=>`<div class="item"><div>${x.image_key?`<img src="/media/${encodeURIComponent(x.image_key)}">`:`<div class="thumb">MR</div>`}</div><div class="info"><b>${esc(x.name)}</b><span>${esc(x.price)} • ${esc(x.condition)} • ${x.available?'موجود':'ناموجود'}</span><p>${esc(x.description)}</p></div><div class="actions"><button onclick='edit(${JSON.stringify(x)})'>ویرایش</button><button class="danger" onclick="del(${x.id})">حذف</button></div></div>`).join('')||'<div class="empty">محصولی وجود ندارد.</div>'}
async function save(){const body={name:$('name').value.trim(),price:$('price').value.trim(),condition:$('condition').value,description:$('desc').value.trim(),image_key:imageKey,available:$('available').checked};try{await api(editing?`/api/products/${editing}`:'/api/products',{method:editing?'PUT':'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});$('msg').textContent='ذخیره شد ✓';resetForm();load()}catch(e){$('msg').textContent=e.message}}
function edit(x){editing=x.id;imageKey=x.image_key||'';$('formTitle').textContent='ویرایش محصول';$('name').value=x.name;$('price').value=x.price;$('condition').value=x.condition;$('desc').value=x.description;$('available').checked=!!x.available;$('preview').innerHTML=imageKey?`<img src="/media/${encodeURIComponent(imageKey)}">`:'';scrollTo(0,0)}
async function del(id){if(!confirm('این محصول حذف شود؟'))return;await api('/api/products/'+id,{method:'DELETE'});load()}
function resetForm(){editing=null;imageKey='';$('formTitle').textContent='افزودن محصول';['name','price','desc','file'].forEach(x=>$(x).value='');$('condition').value='نو';$('available').checked=true;$('preview').innerHTML=''}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
check();
</script></body></html>
